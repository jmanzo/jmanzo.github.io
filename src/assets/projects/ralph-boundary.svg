<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">ralph-sandbox: the agent runs in a container on an internal network; the only way out is an allowlist proxy</title>
<style>
  .bg{fill:#f5f8fb}
  .box{fill:#ffffff;stroke:#b9c8d6;stroke-width:1.5}
  .mine{fill:#e4f1fa;stroke:#0082c9;stroke-width:2}
  .zone{fill:none;stroke:#b9c8d6;stroke-width:1.5;stroke-dasharray:6 6}
  .zonefill{fill:#edf2f7;stroke:none}
  .t{fill:#0c1822;font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:19px}
  .s{fill:#4b6275;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:14px}
  .k{fill:#7a8fa1;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em}
  .ks{fill:#0082c9;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em}
  .ln{stroke:#7a8fa1;stroke-width:1.6;fill:none}
  .lns{stroke:#0082c9;stroke-width:2;fill:none}
  .lnx{stroke:#c0504d;stroke-width:1.8;fill:none;stroke-dasharray:5 5}
  .x{fill:#c0504d;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:600}
  .ah{fill:#7a8fa1}.ahs{fill:#0082c9}.ahx{fill:#c0504d}
  .dot{fill:#0082c9}
  @media (prefers-color-scheme: dark){
    .bg{fill:#080f16}
    .box{fill:#0f1b25;stroke:#2c4356}
    .mine{fill:#0d2a3d;stroke:#3aa7e2}
    .zone{stroke:#2c4356}
    .zonefill{fill:#0f1b25}
    .t{fill:#e7eef4}.s{fill:#9fb3c2}.k{fill:#6e8496}.ks{fill:#3aa7e2}
    .ln{stroke:#6e8496}.lns{stroke:#3aa7e2}
    .ah{fill:#6e8496}.ahs{fill:#3aa7e2}
    .dot{fill:#3aa7e2}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahs"/></marker>
  <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahx"/></marker>
</defs>
<rect class="bg" width="1200" height="675"/>
<text class="k" x="48" y="58" text-anchor="start">RALPH-SANDBOX · THE BOUNDARY</text>
<rect class="zone" x="40" y="90" width="330" height="540" rx="6"/>
<text class="k" x="56" y="116">HOST</text>
<rect class="box" x="64" y="130" width="282" height="120" rx="4"/>
<text class="t" x="80" y="162">Your repository</text>
<text class="s" x="80" y="186">one workspace mount:</text>
<text class="s" x="80" y="207">direct, clone or none</text>
<rect class="mine" x="64" y="280" width="282" height="150" rx="4"/>
<text class="t" x="80" y="312">Snapshots</text>
<text class="s" x="80" y="336">hidden git ref + bundle</text>
<text class="s" x="80" y="357">written outside the</text>
<text class="s" x="80" y="378">mount, before every run</text>
<rect class="box" x="64" y="460" width="282" height="140" rx="4"/>
<text class="t" x="80" y="492">Docker daemon</text>
<text class="s" x="80" y="516">never exposed to</text>
<text class="s" x="80" y="537">the sandbox</text>
<rect class="zone" x="410" y="90" width="420" height="540" rx="6"/>
<text class="k" x="426" y="116">INTERNAL NETWORK, NO ROUTE OFF THE HOST</text>
<rect class="mine" x="434" y="130" width="372" height="250" rx="4"/>
<text class="t" x="450" y="162">Agent container</text>
<text class="s" x="450" y="186">unprivileged user,</text>
<text class="s" x="450" y="207">caps droppable</text>
<text class="s" x="450" y="228"></text>
<text class="s" x="450" y="249">ralph loop: one task per</text>
<text class="s" x="450" y="270">fresh session until the</text>
<text class="s" x="450" y="291">PRD is satisfied</text>
<rect class="mine" x="434" y="410" width="372" height="190" rx="4"/>
<text class="t" x="450" y="442">Allowlist proxy</text>
<text class="s" x="450" y="466">the only container on</text>
<text class="s" x="450" y="487">both networks; refuses</text>
<text class="s" x="450" y="508">any host not on the</text>
<text class="s" x="450" y="529">anchored regex list</text>
<path class="ln" d="M346,190 L434,190" marker-end="url(#a)" marker-start="url(#a)"/>
<path class="lns" d="M620,380 L620,410" marker-end="url(#as)"/>
<rect class="box" x="880" y="130" width="280" height="150" rx="4"/>
<text class="t" x="896" y="162">Allowed hosts</text>
<text class="s" x="896" y="186">model APIs + logins,</text>
<text class="s" x="896" y="207">npm, PyPI, GitHub,</text>
<text class="s" x="896" y="228">Ubuntu mirrors</text>
<path class="lns" d="M806,505 L850,505 L850,205 L880,205" marker-end="url(#as)"/>
<rect class="box" x="880" y="340" width="280" height="110" rx="4"/>
<text class="t" x="896" y="372">Anything else</text>
<text class="s" x="896" y="396">refused at the proxy</text>
<path class="lnx" d="M806,440 L880,400" marker-end="url(#ax)"/>
<rect class="box" x="880" y="490" width="280" height="110" rx="4"/>
<text class="t" x="896" y="522">Raw IP, UDP, ICMP</text>
<text class="s" x="896" y="546">no route at all</text>
<path class="lnx" d="M806,300 L842,300 L842,545 L880,545" marker-end="url(#ax)"/>
</svg>
