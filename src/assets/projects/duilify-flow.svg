<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Duilify price test flow: storefront assigns a price group, a Cart Transform Function applies it, order webhooks feed the results</title>
<style>
  .bg{fill:#f5f8fb}
  .box{fill:#ffffff;stroke:#b9c8d6;stroke-width:1.5}
  .mine{fill:#e4f1fa;stroke:#0082c9;stroke-width:2}
  .zone{fill:none;stroke:#b9c8d6;stroke-width:1.5;stroke-dasharray:6 6}
  .zonefill{fill:#edf2f7;stroke:none}
  .t{fill:#0c1822;font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:19px}
  .s{fill:#4b6275;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:14px}
  .k{fill:#7a8fa1;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em}
  .ks{fill:#0082c9;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em}
  .ln{stroke:#7a8fa1;stroke-width:1.6;fill:none}
  .lns{stroke:#0082c9;stroke-width:2;fill:none}
  .lnx{stroke:#c0504d;stroke-width:1.8;fill:none;stroke-dasharray:5 5}
  .x{fill:#c0504d;font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:13px;font-weight:600}
  .ah{fill:#7a8fa1}.ahs{fill:#0082c9}.ahx{fill:#c0504d}
  .dot{fill:#0082c9}
  @media (prefers-color-scheme: dark){
    .bg{fill:#080f16}
    .box{fill:#0f1b25;stroke:#2c4356}
    .mine{fill:#0d2a3d;stroke:#3aa7e2}
    .zone{stroke:#2c4356}
    .zonefill{fill:#0f1b25}
    .t{fill:#e7eef4}.s{fill:#9fb3c2}.k{fill:#6e8496}.ks{fill:#3aa7e2}
    .ln{stroke:#6e8496}.lns{stroke:#3aa7e2}
    .ah{fill:#6e8496}.ahs{fill:#3aa7e2}
    .dot{fill:#3aa7e2}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahs"/></marker>
  <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahx"/></marker>
</defs>
<rect class="bg" width="1200" height="675"/>
<text class="k" x="48" y="58" text-anchor="start">DUILIFY · HOW A PRICE TEST RUNS</text>
<rect class="mine" x="40" y="220" width="200" height="180" rx="4"/>
<text class="ks" x="56" y="244">STEP 1</text>
<text class="t" x="56" y="270">Merchant</text>
<text class="s" x="56" y="294">sets up a test:</text>
<text class="s" x="56" y="315">product groups,</text>
<text class="s" x="56" y="336">% or fixed change</text>
<path class="lns" d="M240,310 L270,310" marker-end="url(#as)"/>
<rect class="mine" x="270" y="220" width="200" height="180" rx="4"/>
<text class="ks" x="286" y="244">STEP 2</text>
<text class="t" x="286" y="270">Theme ext.</text>
<text class="s" x="286" y="294">splits visitors</text>
<text class="s" x="286" y="315">by distribution,</text>
<text class="s" x="286" y="336">shows the price</text>
<path class="lns" d="M470,310 L500,310" marker-end="url(#as)"/>
<rect class="mine" x="500" y="220" width="200" height="180" rx="4"/>
<text class="ks" x="516" y="244">STEP 3</text>
<text class="t" x="516" y="270">Function</text>
<text class="s" x="516" y="294">Cart Transform</text>
<text class="s" x="516" y="315">reads the group,</text>
<text class="s" x="516" y="336">sets line price</text>
<path class="lns" d="M700,310 L730,310" marker-end="url(#as)"/>
<rect class="mine" x="730" y="220" width="200" height="180" rx="4"/>
<text class="ks" x="746" y="244">STEP 4</text>
<text class="t" x="746" y="270">Webhooks</text>
<text class="s" x="746" y="294">orders recorded</text>
<text class="s" x="746" y="315">per group,</text>
<text class="s" x="746" y="336">idempotently</text>
<path class="lns" d="M930,310 L960,310" marker-end="url(#as)"/>
<rect class="mine" x="960" y="220" width="200" height="180" rx="4"/>
<text class="ks" x="976" y="244">STEP 5</text>
<text class="t" x="976" y="270">Analytics</text>
<text class="s" x="976" y="294">views and sales</text>
<text class="s" x="976" y="315">per variant,</text>
<text class="s" x="976" y="336">side by side</text>
<text class="s" x="40" y="470" text-anchor="start">Remix, Polaris, Prisma + Postgres. Published on the Shopify App Store.</text>
</svg>
